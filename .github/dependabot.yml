updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: ci

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    commit-message:
      include: scope
      prefix: chore

  - package-ecosystem: nix
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: chore

version: 2
