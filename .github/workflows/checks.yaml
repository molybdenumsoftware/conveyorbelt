name: checks

on:
  push:
    branches:
      - master
  pull_request:
  workflow_call:

jobs:
  nix-flake-check:
    strategy:
      matrix:
        runner:
          # - macos-latest
          - ubuntu-latest
        task:
          - name: flake check
            command: nix flake check --accept-flake-config --print-build-logs
          - name: dev shell cargo test
            command: nix develop --command cargo test

    name: ${{ matrix.runner }} ${{ matrix.task.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true
      - name: Set up Nix cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}
      - run: ${{ matrix.task.command }}
